// ============================================================================
// File: build.gradle (App-level)
// Author: Smart Solar Microgrid Trading System Team
// Course: SE4040 - Enterprise Application Development
// Description: App module Gradle configuration for Pure Native Android.
//              Uses OkHttp for REST calls to C# Web API, Gson for JSON parsing,
//              ZXing for QR code generation, and OSMDroid for mapping.
// Architecture: FAT Service Pattern (All business logic in central C# Web API)
// ============================================================================
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smartsolar.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.smartsolar.mobile"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Base URL for the C# Smart Solar Microgrid Central Web API
        buildConfigField "String", "API_BASE_URL", '"http://10.0.2.2:5000/api/"'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        disable 'SourceLockedOrientationActivity', 'DiscouragedApi'
    }
}

dependencies {
    // AndroidX Core Libraries
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // OkHttp3 - Pure Java HTTP client for REST API calls
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Gson - JSON deserialization for C# API responses
    implementation 'com.google.code.gson:gson:2.10.1'

    // ZXing - QR Code generation and display
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'

    // OSMDroid - Offline Maps for nearby solar station visualization
    implementation 'org.osmdroid:osmdroid-android:6.1.18'

    // MPAndroidChart - Line charts for energy transfer history
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Test Libraries
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}